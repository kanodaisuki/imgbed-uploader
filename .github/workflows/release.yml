name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release
      id-token: write # Marketplace 可信发布（OIDC，无需 PAT）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 安装 pnpm + Node 并执行 pnpm install --frozen-lockfile（require-lockfile）
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 12.4.1
          runtime: node@22
          cache: true
          require-lockfile: true

      # vsce 打包时用 npm 执行 vscode:prepublish，而 pnpm 安装的 Node 不带 npm
      - run: pnpm add -g npm

      # vscode:prepublish 自动执行 check-types + lint + esbuild --production
      - run: pnpm run vsix

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vsix=$(ls *.vsix)
          gh release create "$GITHUB_REF_NAME" "$vsix" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm exec vsce publish --oidc --packagePath "$(ls *.vsix)"

      - name: Publish to Open VSX Registry
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "$(ls *.vsix)"
